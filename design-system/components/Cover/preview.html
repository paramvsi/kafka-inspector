<!-- @dsCard height=320 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copper Oxide</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 320px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 320px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 320px; }
  .copper { fill: var(--copper); }
  .tint { fill: var(--copper-soft); }
  .deep { fill: var(--ink); }
  .patina { fill: var(--verdigris); }
  .blk { rx: var(--radius-lg); }
  .bar { fill: var(--bg); rx: var(--radius-sm); }
  .lag { fill: var(--copper); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .95; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      copper 144x288 bled off the top (identity, largest) · verdigris 96x64 (the patina hue) · copper-soft 96x160 (relief tint) · ink 216x224 bleeding off the right edge · about a third of 960x320
  arrangement one tall copper slab with satellites; bottoms on one line space-6 above the edge; space-4 gutters
  pattern     literal motif from the logo ("a copper lens over partition bars, one consumer behind"): space-2-tall partition bars cut out of the ink block in bg, at a space-6 pitch, three ending in a copper lag dot
  scales      sides in space-4 / space-6 multiples; gutters space-4; pitch space-6; blocks radius-lg; bars radius-sm (half of space-2); dots space-3 across
-->
<rect class="copper blk" x="24" y="-16" width="144" height="288" rx="12"/>
<rect class="patina blk" x="184" y="32" width="96" height="64" rx="12"/>
<rect class="tint blk" x="184" y="112" width="96" height="160" rx="12"/>
<rect class="deep blk" x="296" y="48" width="216" height="224" rx="12"/>
<rect class="bar" x="320" y="80" width="136" height="8" rx="4"/>
<rect class="bar" x="320" y="104" width="88" height="8" rx="4"/>
<circle class="lag" cx="428" cy="108" r="6"/>
<rect class="bar" x="320" y="128" width="144" height="8" rx="4"/>
<rect class="bar" x="320" y="152" width="112" height="8" rx="4"/>
<rect class="bar" x="320" y="176" width="64" height="8" rx="4"/>
<circle class="lag" cx="404" cy="180" r="6"/>
<rect class="bar" x="320" y="200" width="128" height="8" rx="4"/>
<rect class="bar" x="320" y="224" width="96" height="8" rx="4"/>
<circle class="lag" cx="436" cy="228" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Copper<br>Oxide</h1>
<p class="tag">The design system behind Kafka Inspector.</p>
</div>
</div>
</body>
</html>

[build]
  command = "pnpm --filter web build"
  publish = "apps/web/out"

# The hosted demo never has an agent: skip the /api/info probe.
[build.environment]
  NEXT_PUBLIC_KI_MODE = "demo"

# Every /app route is pre-rendered as <route>/index.html (trailingSlash) and detail pages use query
# params (/app/topics/view/?name=…), so no SPA rewrite is needed. Unknown paths get out/404.html.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The message-filter worker runs user expressions: same policy as the agent's (no network, eval allowed).
[[headers]]
  for = "/_next/static/chunks/turbopack-worker-*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'none'"

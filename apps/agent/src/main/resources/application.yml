# Kafka Inspector agent. Every setting is an env variable (KI_*) or a key in /config/kafka-inspector.yml.
spring:
  application:
    name: kafka-inspector-agent
  lifecycle:
    # docker stop sends SIGKILL after 10 s: finish the graceful shutdown (default 30 s) inside that window
    timeout-per-shutdown-phase: 8s
  config:
    import: optional:file:/config/kafka-inspector.yml
  datasource:
    url: ${KI_DB_URL:jdbc:h2:file:/data/ki;AUTO_SERVER=FALSE}
    username: ${KI_DB_USER:sa}
    password: ${KI_DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
server:
  port: ${KI_PORT:8080}
  # native = Tomcat RemoteIpValve: X-Forwarded-* trusted only from private-network proxies, so a client
  # on the internet can't spoof its IP past the sign-in rate limit; behind a TLS proxy the scheme is honoured
  forward-headers-strategy: native
  shutdown: graceful
  servlet:
    session:
      timeout: 12h
      cookie:
        name: KI_SESSION
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: []
logging:
  level:
    root: info
    org.apache.kafka: warn
ki:
  sample-interval: ${KI_SAMPLE_INTERVAL:10s}
  history-retention: ${KI_HISTORY_RETENTION:7d}

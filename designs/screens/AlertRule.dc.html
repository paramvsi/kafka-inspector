<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert rule builder</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/copperoxide/tokens.css">
<link rel="stylesheet" href="ds/copperoxide/components/bundle.css">
<script src="ds/copperoxide/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; display: flex; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 13px">
<dc-import name="Sidebar" active="alerts" hint-size="232px,800px"></dc-import>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<dc-import name="Topbar" crumb="Alerts" hint-size="1048px,56px"></dc-import>
<main style="padding: 24px"><h1 class="page-title" style="margin: 0">Alerts</h1></main>
</div>
<div style="position: absolute; inset: 0; background: rgba(5, 9, 7, 0.62); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="ar-title" style="width: 620px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-popover); display: flex; flex-direction: column">
<div style="padding: 20px 24px 8px"><h2 id="ar-title" class="section-title" style="margin: 0; font-size: 17px">New alert rule</h2><div style="color: var(--ink-muted); margin-top: 2px">Checked every 10 seconds against live metrics.</div></div>
<div style="padding: 12px 24px; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Name</span><input value="Lag too high" style="height: 36px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 13px"></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">When</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<select aria-label="Metric" style="height: 36px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 13px"><option>Consumer lag</option></select>
<span style="color: var(--ink-muted)">of</span>
<select aria-label="Scope" style="height: 36px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-mono); font-size: 12px"><option>any group</option></select>
<span style="color: var(--ink-muted)">is above</span>
<input aria-label="Threshold" value="5,000" style="width: 80px; height: 36px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--copper); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-mono); font-size: 12px">
<span style="color: var(--ink-muted)">for</span>
<select aria-label="Duration" style="height: 36px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 13px"><option>5 minutes</option></select>
</div></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-weight: 600">Severity</span><x-import component-from-global-scope="CopperOxide.SegmentedControl" label="Severity" options="{{ sev }}" default-value="Warning"></x-import></div>
<div style="background: var(--surface-sunken); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 600">Preview · last 24 h</span><span style="color: var(--ink-muted)">Would have fired 3 times</span></div>
<svg width="100%" height="56" viewBox="0 0 560 56" preserveAspectRatio="none" role="img" aria-label="Lag over 24 hours crossing the threshold three times"><line x1="0" y1="22" x2="560" y2="22" stroke-dasharray="4 4" style="stroke: var(--warn)"></line><polyline points="0,50 40,48 80,44 120,30 140,14 160,30 200,46 260,48 300,40 330,18 350,12 370,26 420,46 470,44 500,30 530,10 560,8" fill="none" stroke-width="1.5" style="stroke: var(--chart-1)"></polyline></svg>
</div>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="font-weight: 600; padding: 0; margin-bottom: 4px">Notify</legend>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: var(--copper)">In the app (bell and toast)</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: var(--copper)">Browser notification</label>
<label style="display: flex; align-items: center; gap: 8px; color: var(--ink-muted)"><input type="checkbox" disabled style="accent-color: var(--copper)">Slack or webhook · needs the local agent</label>
</fieldset>
</div>
<div style="padding: 16px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end">
<x-import component-from-global-scope="CopperOxide.Button" variant="ghost">Cancel</x-import>
<x-import component-from-global-scope="CopperOxide.Button" variant="primary">Create rule</x-import>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return { sev: ['Info', 'Warning', 'Critical'] }; }
}
</script>
</body>
</html>

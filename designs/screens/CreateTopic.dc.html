<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create topic</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/copperoxide/tokens.css">
<link rel="stylesheet" href="ds/copperoxide/components/bundle.css">
<script src="ds/copperoxide/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; display: flex; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 13px">
<dc-import name="Sidebar" active="topics" hint-size="232px,800px"></dc-import>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<dc-import name="Topbar" crumb="Topics" hint-size="1048px,56px"></dc-import>
<main style="padding: 24px"><h1 class="page-title" style="margin: 0">Topics</h1></main>
</div>
<div style="position: absolute; inset: 0; background: rgba(5, 9, 7, 0.62); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="ct-title" style="width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-popover); display: flex; flex-direction: column">
<div style="padding: 20px 24px 4px; display: flex; align-items: flex-start"><div><h2 id="ct-title" class="section-title" style="margin: 0; font-size: 17px">Create topic</h2><div style="color: var(--ink-muted); margin-top: 2px">on prod-eu-1 · 3 brokers</div></div><span style="flex-grow: 1"></span><button type="button" aria-label="Close" style="width: 32px; height: 32px; border: none; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font-size: 18px">×</button></div>
<div style="padding: 16px 24px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Name</span><input value="shipment-events" style="height: 36px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--copper); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-mono); font-size: 12px; outline: none"><span style="font-size: 12px; color: var(--ink-muted)">Letters, numbers, dots, dashes and underscores. Can't be renamed later.</span></label>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Partitions</span><input value="12" style="height: 36px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-mono); font-size: 12px"><span style="font-size: 12px; color: var(--ink-muted)">Can be increased later, never decreased.</span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Replication factor</span><input value="3" style="height: 36px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-mono); font-size: 12px"><span style="font-size: 12px; color: var(--ok)">✓ Fits 3 brokers · survives 1 broker loss</span></label>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Retention</span><select style="height: 36px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 13px"><option>7 days (cluster default)</option></select></label>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px"><legend style="font-weight: 600; padding: 0; margin-bottom: 6px">Cleanup policy</legend><div style="display: flex; gap: 16px; height: 36px; align-items: center"><label style="display: flex; gap: 6px; align-items: center"><input type="radio" name="cp" checked style="accent-color: var(--copper)">Delete</label><label style="display: flex; gap: 6px; align-items: center"><input type="radio" name="cp" style="accent-color: var(--copper)">Compact</label><label style="display: flex; gap: 6px; align-items: center"><input type="radio" name="cp" style="accent-color: var(--copper)">Both</label></div></fieldset>
</div>
<details style="border: 1px solid var(--line-subtle); border-radius: var(--radius-md); padding: 10px 12px"><summary style="cursor: pointer; font-weight: 600">Advanced config <span style="font-weight: 400; color: var(--ink-muted)">· 2 overrides</span></summary></details>
<div style="background: var(--surface-sunken); border-radius: var(--radius-md); padding: 10px 12px; font-family: var(--font-mono); font-size: 11px; line-height: 17px; color: var(--ink-muted)">kafka-topics.sh --create --topic shipment-events --partitions 12 --replication-factor 3 --config min.insync.replicas=2</div>
</div>
<div style="padding: 16px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end">
<x-import component-from-global-scope="CopperOxide.Button" variant="ghost">Cancel</x-import>
<x-import component-from-global-scope="CopperOxide.Button" variant="primary">Create topic</x-import>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

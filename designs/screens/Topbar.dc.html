<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topbar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/copperoxide/tokens.css">
<link rel="stylesheet" href="ds/copperoxide/components/bundle.css">
<script src="ds/copperoxide/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="width: 1048px; height: 56px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--font-sans); font-size: 13px; color: var(--ink)">
<div style="color: var(--ink-muted)">prod-eu-1 <span style="color: var(--line-strong)">/</span> {{ parent }}<span style="color: var(--ink); font-weight: 600">{{ crumb }}</span></div>
<div style="flex-grow: 1"></div>
<x-import component-from-global-scope="CopperOxide.SearchInput" placeholder="Search topics, groups, offsets"></x-import>
<x-import component-from-global-scope="CopperOxide.SegmentedControl" label="Time range" options="{{ ranges }}" default-value="1h"></x-import>
<div style="display: flex; align-items: center; gap: 6px; color: var(--ok); font-size: 12px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok)"></span>Live</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumb":{"editor":"text","default":"Overview"},"parent":{"editor":"text","default":""},"$preview":{"width":1048,"height":56}}'>
class Component extends DCLogic {
renderVals() {
var p = this.props.parent ?? '';
return { crumb: this.props.crumb ?? 'Overview', parent: p ? p + ' / ' : '', ranges: ['15m', '1h', '24h', '7d'] };
}
}
</script>
</body>
</html>

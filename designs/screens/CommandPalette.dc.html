<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/copperoxide/tokens.css">
<link rel="stylesheet" href="ds/copperoxide/components/bundle.css">
<script src="ds/copperoxide/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; display: flex; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 13px">
<dc-import name="Sidebar" active="overview" hint-size="232px,800px"></dc-import>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<dc-import name="Topbar" crumb="Overview" hint-size="1048px,56px"></dc-import>
<main style="padding: 24px"><h1 class="page-title" style="margin: 0">Overview</h1></main>
</div>
<div style="position: absolute; inset: 0; background: rgba(5, 9, 7, 0.62); display: flex; justify-content: center; padding-top: 110px; box-sizing: border-box">
<div role="dialog" aria-modal="true" aria-label="Command palette" style="width: 620px; height: max-content; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-popover); overflow: hidden">
<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true" style="stroke: var(--ink-muted)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input aria-label="Search everything" value="pay" style="flex-grow: 1; border: none; outline: none; background: transparent; color: var(--ink); font-family: var(--font-sans); font-size: 15px"><span class="co-kbd">Esc</span></label>
<div style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
<div class="co-nav-section" style="padding: 8px 10px 4px">Topics</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md); background: var(--copper-soft)"><span class="co-mono" style="font-size: 12px"><b>pay</b>ments</span><span style="color: var(--ink-muted); font-size: 12px">12 partitions · 7.5k/s</span><span style="flex-grow: 1"></span><span class="co-kbd">↵</span></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md)"><span class="co-mono" style="font-size: 12px"><b>pay</b>ments.dlq</span><span style="color: var(--ink-muted); font-size: 12px">3 partitions · 4/s</span></div>
<div class="co-nav-section" style="padding: 8px 10px 4px">Consumer groups</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md)"><span class="co-mono" style="font-size: 12px"><b>pay</b>ments-sink</span><span class="co-badge co-badge-warn">Warn</span><span style="color: var(--ink-muted); font-size: 12px">lag 9,312</span></div>
<div class="co-nav-section" style="padding: 8px 10px 4px">Actions</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md)">Reset offsets for <span class="co-mono" style="font-size: 12px">payments-sink</span>…</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md)">Produce message to <span class="co-mono" style="font-size: 12px">payments</span>…</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md)">Compare schema <span class="co-mono" style="font-size: 12px">payments-value</span> versions</div>
</div>
<div style="display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted)"><span><span class="co-kbd">↑</span> <span class="co-kbd">↓</span> move</span><span><span class="co-kbd">↵</span> open</span><span><span class="co-kbd">⌘↵</span> open in new tab</span><span style="flex-grow: 1"></span><span>Type <span class="co-mono" style="font-size: 11px">&gt;</span> for actions only</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/copperoxide/tokens.css">
<link rel="stylesheet" href="ds/copperoxide/components/bundle.css">
<script src="ds/copperoxide/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 232px; height: 800px; box-sizing: border-box; padding: 16px 12px; background: var(--bg-sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; font-family: var(--font-sans); color: var(--ink)">
<div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px">
<img src="{{ markSrc }}" alt="" style="width: 24px; height: 24px">
<div style="font-weight: 600; font-size: 14px">Kafka Inspector</div>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; margin-bottom: 14px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: 11px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok)"></span>prod-eu-1<span style="flex-grow: 1"></span><span style="color: var(--ink-muted)">⌄</span></button>
<div class="co-nav-section">Monitor</div>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Overview" active="{{ nav.overview }}"></x-import>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Brokers" count="3" active="{{ nav.brokers }}"></x-import>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Topics" count="42" active="{{ nav.topics }}"></x-import>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Consumer groups" count="6" active="{{ nav.groups }}"></x-import>
<div class="co-nav-section" style="margin-top: 10px">Data</div>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Schemas" active="{{ nav.schemas }}"></x-import>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Topology" active="{{ nav.topology }}"></x-import>
<div class="co-nav-section" style="margin-top: 10px">Operate</div>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Alerts" count="2" count-tone="crit" active="{{ nav.alerts }}"></x-import>
<sc-if value="{{ demo }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="CopperOxide.NavItem" label="Chaos panel" active="{{ nav.chaos }}"></x-import>
</sc-if>
<x-import component-from-global-scope="CopperOxide.NavItem" label="Clusters" active="{{ nav.clusters }}"></x-import>
<sc-if value="{{ demo }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="CopperOxide.NavItem" label="Run on your Kafka" active="{{ nav.selfhost }}"></x-import>
</sc-if>
<div style="flex-grow: 1"></div>
<sc-if value="{{ demo }}" hint-placeholder-val="{{ true }}">
<div style="border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: 10px 12px; font-size: 12px; line-height: 16px; color: var(--ink-muted)">
<div style="color: var(--ink); font-weight: 600; margin-bottom: 2px">Simulated cluster</div>
Data is generated in your browser. Run it on your own Kafka from the link above.
</div>
</sc-if>
<sc-if value="{{ selfhosted }}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid var(--line); padding: 12px 8px 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-muted)">
<div style="display: flex; align-items: center; gap: 8px"><span class="co-badge co-badge-neutral">Read-only</span><span class="co-mono" style="font-size: 10px">v1.0.0</span></div>
<div style="display: flex; align-items: center"><span>Signed in as <span style="color: var(--ink)">admin</span></span><span style="flex-grow: 1"></span><a href="#" style="color: var(--copper)">Sign out</a></div>
</div>
</sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","brokers","topics","groups","schemas","topology","alerts","chaos","clusters","selfhost"],"default":"overview"},"light":{"editor":"boolean","default":false},"selfhosted":{"editor":"boolean","default":false},"$preview":{"width":232,"height":800}}'>
class Component extends DCLogic {
renderVals() {
var a = this.props.active ?? 'overview';
var keys = ['overview','brokers','topics','groups','schemas','topology','alerts','chaos','clusters','selfhost'];
var nav = {};
keys.forEach(function (k) { nav[k] = a === k; });
var sh = !!this.props.selfhosted;
return { nav: nav, demo: !sh, selfhosted: sh, markSrc: this.props.light ? '../../assets/brand/kafka-inspector-icon-light.png' : '../../assets/brand/kafka-inspector-icon-dark.png' };
}
}
</script>
</body>
</html>

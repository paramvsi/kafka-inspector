name: Nightly

# The Playwright suite on Firefox and WebKit, plus Chromium (each leg runs one browser project; the
# reduced-motion project runs in CI on every push).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # firefox/webkit are slower; GitHub's default is 360: a hung browser run would hold the job for 6 h
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter web exec playwright test --project=chromium
        if: matrix.browser == 'chromium'
      - run: pnpm --filter web exec playwright test --project=${{ matrix.browser }}
        if: matrix.browser != 'chromium'

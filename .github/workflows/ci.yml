name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs the same checks for the tagged commit

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# read-only token: when release.yml calls this workflow, its tests don't need its write scopes
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Testcontainers (Kafka 4.1) runs on the runner's Docker
      - run: ./gradlew check --no-daemon
        working-directory: apps/agent

  image:
    runs-on: ubuntu-latest
    needs: [web, agent]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: ghcr.io/paramvsi/kafka-inspector:ci
          load: true
      - name: Image size and start time
        run: |
          docker image inspect ghcr.io/paramvsi/kafka-inspector:ci --format '{{.Size}}' | awk '{ s=$1/1e6; print "image " s " MB"; if (s > 300) exit 1 }'
      - name: Hardened image against real Kafka (health, user 10001, snappy/zstd/lz4/gzip topics)
        run: bash scripts/image-smoke.sh ghcr.io/paramvsi/kafka-inspector:ci

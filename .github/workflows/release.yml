name: Release

# Publishes ghcr.io/paramvsi/kafka-inspector:<version> when a v* tag is pushed.
# Not triggered yet: the product name must be settled before the first image is published.
on:
  push:
    tags: ['v*']

permissions: {} # each job asks for what it needs

jobs:
  # the same checks as CI must pass for the tagged commit before anything is published
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the ghcr.io image
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the main check below needs the history
      - name: Tagged commit is on main
        # a v* tag on a feature branch would otherwise publish :latest and a stable release from unmerged code
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main; tag a merged commit."; exit 1; }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        # v1.2.3 → stable (also :latest); v1.2.3-rc1 → pre-release (version tag only)
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          # :latest only for the highest stable version: a v1.0.1 hotfix after v1.1.0 must not move it back
          top=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | awk '!/-/' | sort -V | tail -1)
          if [[ "$v" != *-* && "$v" == "$top" ]]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/paramvsi/kafka-inspector:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && 'ghcr.io/paramvsi/kafka-inspector:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 — third-party action with write scopes: pinned to a commit
        with:
          generate_release_notes: true
          prerelease: ${{ steps.v.outputs.pre == 'true' }}

name: Release

# Publishes ghcr.io/paramvsi/kafka-inspector:<version> when a v* tag is pushed.
# Not triggered yet: the product name (DECISIONS Q-01) must be settled before the first image is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/paramvsi/kafka-inspector:${{ steps.v.outputs.version }}
            ghcr.io/paramvsi/kafka-inspector:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

name: Release

# Publishes ghcr.io/paramvsi/kafka-inspector:<version> when a v* tag is pushed.
# Not triggered yet: the product name must be settled before the first image is published.
on:
  push:
    tags: ['v*']

permissions: {} # each job asks for what it needs

jobs:
  # the same checks as CI must pass for the tagged commit before anything is published
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the ghcr.io image
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        # v1.2.3 → stable (also :latest); v1.2.3-rc1 → pre-release (version tag only)
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/paramvsi/kafka-inspector:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.pre == 'false' && 'ghcr.io/paramvsi/kafka-inspector:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 — third-party action with write scopes: pinned to a commit
        with:
          generate_release_notes: true
          prerelease: ${{ steps.v.outputs.pre == 'true' }}
